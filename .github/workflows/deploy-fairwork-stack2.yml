name: Deploy FairWork Stack 2 Database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fairwork-stack2-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  INFRASTRUCTURE_STACK_NAME: fairwork-infrastructure
  APPLICATION_STACK_NAME: fairwork-application-602az
  TEMPLATE_FILE: fairwork-stack2-application.yaml
  LAMBDA_RUNTIME: nodejs18.x

jobs:

  deploy-database:

    name: Deploy and test database migration

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ======================================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================================
      # 2. SET UP NODE.JS
      # ======================================================================

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'


      # ======================================================================
      # 3. CONFIGURE AWS ACADEMY CREDENTIALS
      # ======================================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true


      # ======================================================================
      # 4. VERIFY AWS IDENTITY
      # ======================================================================

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "Checking AWS identity..."

          aws sts get-caller-identity

          echo "AWS identity confirmed."


      # ======================================================================
      # 5. VERIFY STACK 1
      # ======================================================================

      - name: Verify Stack 1
        run: |
          set -euo pipefail

          echo "Checking infrastructure stack..."

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${INFRASTRUCTURE_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Stack 1 status: ${STACK_STATUS}"

          if [[ "${STACK_STATUS}" != *"_COMPLETE" ]]; then

            echo "ERROR: Stack 1 is not in a COMPLETE state."

            exit 1

          fi

          echo "Stack 1 is ready."


      # ======================================================================
      # 6. CHECK REQUIRED REPOSITORY FILES
      # ======================================================================

      - name: Check required repository files
        run: |
          set -euo pipefail

          echo "Checking required files..."

          required_files=(
            "${TEMPLATE_FILE}"
            "lambda/migrations/index.js"
            "lambda/migrations/package.json"
            "database/migrations/V001__initial_schema.sql"
            "database/migrations/V002__moderation_rules.sql"
          )

          for file in "${required_files[@]}"; do

            if [ ! -f "${file}" ]; then

              echo "ERROR: Missing required file: ${file}"

              exit 1

            fi

            echo "Found: ${file}"

          done

          echo "All required Stack 2 files are present."


      # ======================================================================
      # 7. READ LAMBDA ARTIFACT BUCKET FROM STACK 1
      # ======================================================================

      - name: Read artifact bucket from Stack 1
        id: infrastructure
        run: |
          set -euo pipefail

          echo "Reading Lambda artifact bucket from Stack 1..."

          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${INFRASTRUCTURE_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue | [0]" \
            --output text)

          if [ -z "${ARTIFACT_BUCKET}" ] || \
             [ "${ARTIFACT_BUCKET}" = "None" ]; then

            echo "ERROR: LambdaArtifactBucketName was not found in Stack 1."

            exit 1

          fi

          echo "artifact_bucket=${ARTIFACT_BUCKET}" \
            >> "${GITHUB_OUTPUT}"

          echo "Artifact bucket found."


      # ======================================================================
      # 8. VALIDATE STACK 2 CLOUDFORMATION TEMPLATE
      # ======================================================================

      - name: Validate Stack 2 template
        run: |
          set -euo pipefail

          echo "Validating ${TEMPLATE_FILE}..."

          aws cloudformation validate-template \
            --template-body "file://${TEMPLATE_FILE}" \
            --region "${AWS_REGION}"

          echo "Stack 2 template validation completed."


      # ======================================================================
      # 9. CREATE CLEAN BUILD DIRECTORY
      # ======================================================================

      - name: Prepare Migration Lambda package
        run: |
          set -euo pipefail

          echo "Creating clean build directory..."

          rm -rf build

          mkdir -p build/migration/migrations


          # ------------------------------------------------------------------
          # Copy Migration Lambda source
          # ------------------------------------------------------------------

          echo "Copying Migration Lambda source..."

          cp \
            lambda/migrations/index.js \
            build/migration/index.js

          cp \
            lambda/migrations/package.json \
            build/migration/package.json


          # ------------------------------------------------------------------
          # Copy database migrations
          # ------------------------------------------------------------------

          echo "Copying SQL migrations..."

          cp \
            database/migrations/V001__initial_schema.sql \
            build/migration/migrations/

          cp \
            database/migrations/V002__moderation_rules.sql \
            build/migration/migrations/


          echo "Migration source prepared successfully."


      # ======================================================================
      # 10. INSTALL NODE.JS PRODUCTION DEPENDENCIES
      # ======================================================================

      - name: Install Migration Lambda dependencies
        run: |
          set -euo pipefail

          echo "Installing Migration Lambda dependencies..."

          pushd build/migration > /dev/null

          npm install \
            --omit=dev \
            --no-audit \
            --no-fund

          popd > /dev/null

          echo "Production dependencies installed."


      # ======================================================================
      # 11. VERIFY BUILD CONTENTS
      # ======================================================================

      - name: Verify Migration Lambda package contents
        run: |
          set -euo pipefail

          echo "Migration Lambda build contents:"

          find build/migration \
            -maxdepth 2 \
            -type f \
            | sort


          # ------------------------------------------------------------------
          # Check Lambda source
          # ------------------------------------------------------------------

          if [ ! -f "build/migration/index.js" ]; then

            echo "ERROR: Migration index.js missing from build."

            exit 1

          fi


          if [ ! -f "build/migration/package.json" ]; then

            echo "ERROR: Migration package.json missing from build."

            exit 1

          fi


          # ------------------------------------------------------------------
          # Check V001
          # ------------------------------------------------------------------

          if [ ! -f \
            "build/migration/migrations/V001__initial_schema.sql" ]; then

            echo "ERROR: V001 migration missing from build."

            exit 1

          fi


          # ------------------------------------------------------------------
          # Check V002
          # ------------------------------------------------------------------

          if [ ! -f \
            "build/migration/migrations/V002__moderation_rules.sql" ]; then

            echo "ERROR: V002 migration missing from build."

            exit 1

          fi


          # ------------------------------------------------------------------
          # Check node_modules
          # ------------------------------------------------------------------

          if [ ! -d "build/migration/node_modules" ]; then

            echo "ERROR: node_modules missing from build."

            exit 1

          fi


          echo "Migration Lambda build verified successfully."


      # ======================================================================
      # 12. CREATE MIGRATION LAMBDA ZIP
      # ======================================================================

      - name: Create Migration Lambda ZIP
        run: |
          set -euo pipefail

          echo "Creating Migration Lambda deployment ZIP..."

          pushd build/migration > /dev/null

          zip \
            -qr \
            ../migration.zip \
            .

          popd > /dev/null

          echo "Migration Lambda ZIP created."

          ls -lh build/migration.zip


      # ======================================================================
      # 13. UPLOAD MIGRATION ZIP TO S3
      # ======================================================================

      - name: Upload Migration Lambda package
        id: package
        env:
          ARTIFACT_BUCKET: ${{ steps.infrastructure.outputs.artifact_bucket }}

        run: |
          set -euo pipefail

          PREFIX="stack2/migration/${GITHUB_SHA}"

          MIGRATION_KEY="${PREFIX}/migration.zip"

          echo "Uploading migration package to S3..."

          aws s3 cp \
            build/migration.zip \
            "s3://${ARTIFACT_BUCKET}/${MIGRATION_KEY}" \
            --region "${AWS_REGION}"

          echo "migration_key=${MIGRATION_KEY}" \
            >> "${GITHUB_OUTPUT}"

          echo "Migration package uploaded successfully."

          echo "S3 object key: ${MIGRATION_KEY}"


      # ======================================================================
      # 14. DEPLOY STACK 2
      # ======================================================================

      - name: Deploy Stack 2
        run: |
          set -euo pipefail

          echo "Deploying FairWork Pulse Stack 2..."

          aws cloudformation deploy \
            --stack-name "${APPLICATION_STACK_NAME}" \
            --template-file "${TEMPLATE_FILE}" \
            --region "${AWS_REGION}" \
            --parameter-overrides \
              InfrastructureStackName="${INFRASTRUCTURE_STACK_NAME}" \
              ProjectName=fairwork-pulse \
              EnvironmentName=poc \
              LambdaRuntime="${LAMBDA_RUNTIME}" \
              MigrationLambdaS3Key="${{ steps.package.outputs.migration_key }}" \
              DeploymentVersion="${GITHUB_SHA}" \
            --tags \
              Project=FairWorkPulse \
              Environment=PoC \
              Component=DatabaseMigration \
              ManagedBy=CloudFormation \
            --no-fail-on-empty-changeset

          echo "Stack 2 deployment completed."


      # ======================================================================
      # 15. READ MIGRATION FUNCTION NAME
      # ======================================================================

      - name: Read Migration Lambda name
        id: migration
        run: |
          set -euo pipefail

          echo "Reading Migration Lambda name from Stack 2..."

          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${APPLICATION_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='MigrationFunctionName'].OutputValue | [0]" \
            --output text)

          if [ -z "${FUNCTION_NAME}" ] || \
             [ "${FUNCTION_NAME}" = "None" ]; then

            echo "ERROR: MigrationFunctionName was not found."

            exit 1

          fi

          echo "function_name=${FUNCTION_NAME}" \
            >> "${GITHUB_OUTPUT}"

          echo "Migration Lambda: ${FUNCTION_NAME}"


      # ======================================================================
      # 16. INVOKE MIGRATION LAMBDA
      # ======================================================================

      - name: Run database migrations
        run: |
          set -euo pipefail

          echo "Invoking Migration Lambda..."

          aws lambda invoke \
            --function-name "${{ steps.migration.outputs.function_name }}" \
            --region "${AWS_REGION}" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            migration-response.json \
            --output json \
            > migration-invoke.json


          echo
          echo "Lambda invocation metadata:"
          cat migration-invoke.json


          echo
          echo "Migration Lambda response:"
          cat migration-response.json
          echo


          # ------------------------------------------------------------------
          # Detect Lambda execution failure
          # ------------------------------------------------------------------

          FUNCTION_ERROR=$(jq -r \
            '.FunctionError // empty' \
            migration-invoke.json)


          if [ -n "${FUNCTION_ERROR}" ]; then

            echo "ERROR: Migration Lambda returned FunctionError."

            echo
            echo "Lambda response:"
            cat migration-response.json

            exit 1

          fi


          # ------------------------------------------------------------------
          # Check application response
          # ------------------------------------------------------------------

          SUCCESS=$(jq -r \
            '.body | fromjson | .success // false' \
            migration-response.json)


          if [ "${SUCCESS}" != "true" ]; then

            echo "ERROR: Migration Lambda did not report success."

            cat migration-response.json

            exit 1

          fi


          echo
          echo "Database migrations completed successfully."


      # ======================================================================
      # 17. SECOND INVOCATION
      #
      # This verifies that V001 and V002 are not executed twice.
      # ======================================================================

      - name: Verify migrations are idempotent
        run: |
          set -euo pipefail

          echo "Running Migration Lambda for a second time..."

          aws lambda invoke \
            --function-name "${{ steps.migration.outputs.function_name }}" \
            --region "${AWS_REGION}" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            migration-second-response.json \
            --output json \
            > migration-second-invoke.json


          echo
          echo "Second invocation metadata:"
          cat migration-second-invoke.json


          echo
          echo "Second migration response:"
          cat migration-second-response.json
          echo


          FUNCTION_ERROR=$(jq -r \
            '.FunctionError // empty' \
            migration-second-invoke.json)


          if [ -n "${FUNCTION_ERROR}" ]; then

            echo "ERROR: Second Migration Lambda invocation failed."

            exit 1

          fi


          SUCCESS=$(jq -r \
            '.body | fromjson | .success // false' \
            migration-second-response.json)


          if [ "${SUCCESS}" != "true" ]; then

            echo "ERROR: Second migration invocation did not report success."

            exit 1

          fi


          echo "Second migration invocation completed successfully."


      # ======================================================================
      # 18. DISPLAY STACK 2 OUTPUTS
      #
      # Only run this if Stack 2 actually exists.
      # ======================================================================

      - name: Display Stack 2 outputs
        if: success()

        run: |
          set -euo pipefail

          echo "Stack 2 outputs:"

          aws cloudformation describe-stacks \
            --stack-name "${APPLICATION_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table
