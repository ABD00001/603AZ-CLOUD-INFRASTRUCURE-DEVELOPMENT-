    Properties:
      Action:
        lambda:InvokeFunction
      FunctionName:
        !Ref ApiFunction
      Principal:
        apigateway.amazonaws.com
      SourceArn:
        !Sub
          'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${FairWorkApi}/*/*/*'
  ModerationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${EnvironmentName}-moderation-dlq'
      MessageRetentionPeriod: 1209600
  ModerationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${EnvironmentName}-moderation'
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ModerationDeadLetterQueue.Arn
        maxReceiveCount: 5
  ModerationWorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-moderation-worker'
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role:
        Fn::ImportValue: !Sub '${InfrastructureStackName}-LabRoleArn'
      Timeout: 60
      MemorySize: 256
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub '${InfrastructureStackName}-LambdaArtifactBucketName'
        S3Key: !Ref WorkerLambdaS3Key
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub '${InfrastructureStackName}-LambdaSecurityGroupId'
        SubnetIds:
          - Fn::ImportValue: !Sub '${InfrastructureStackName}-PrivateAppSubnetAId'
          - Fn::ImportValue: !Sub '${InfrastructureStackName}-PrivateAppSubnetBId'
      Environment:
        Variables:
          DB_HOST:
            Fn::ImportValue: !Sub '${InfrastructureStackName}-DatabaseEndpoint'
          DB_PORT:
            Fn::ImportValue: !Sub '${InfrastructureStackName}-DatabasePort'
          DB_NAME:
            Fn::ImportValue: !Sub '${InfrastructureStackName}-DatabaseName'
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub '${InfrastructureStackName}-DatabaseSecretArn'
  ModerationEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ModerationQueue.Arn
      FunctionName: !Ref ModerationWorkerFunction
      BatchSize: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures
  CompanyReviewsResource:
