AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Application services.
  Deploys database migrations, Cognito authentication,
  API Gateway REST API and the FairWork Pulse API Lambda.
Parameters:
  ProjectName:
    Type: String
    Default: fairwork-pulse
  EnvironmentName:
    Type: String
    Default: poc
  InfrastructureStackName:
    Type: String
    Default: fairwork-infrastructure
  LambdaRuntime:
    Type: String
    Default: nodejs18.x
    AllowedValues:
      - nodejs18.x
  MigrationLambdaS3Key:
    Type: String
    Description: S3 object key containing the Migration Lambda package.
  ApiLambdaS3Key:
    Type: String
    Description: S3 object key containing the API Lambda package.
  WorkerLambdaS3Key:
    Type: String
    Description: S3 object key containing moderation worker package.
  DeploymentVersion:
    Type: String
    Default: manual
  ApiStageName:
    Type: String
    Default: poc
  AllowedOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Allowed frontend origin for CORS.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
Resources:
  MigrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        !Sub '${ProjectName}-${EnvironmentName}-database-migration'
      Description: >
        Applies version-controlled FairWork Pulse SQL migrations
        to the private RDS MySQL database.
      Runtime:
        !Ref LambdaRuntime
      Handler:
        index.handler
      Role:
        Fn::ImportValue:
          !Sub '${InfrastructureStackName}-LabRoleArn'
      MemorySize: 256
      Timeout: 120
      ReservedConcurrentExecutions: 1
      Code:
        S3Bucket:
          Fn::ImportValue:
            !Sub '${InfrastructureStackName}-LambdaArtifactBucketName'
        S3Key:
          !Ref MigrationLambdaS3Key
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub '${InfrastructureStackName}-LambdaSecurityGroupId'
        SubnetIds:
          - Fn::ImportValue:
              !Sub '${InfrastructureStackName}-PrivateAppSubnetAId'
          - Fn::ImportValue:
              !Sub '${InfrastructureStackName}-PrivateAppSubnetBId'
      Environment:
        Variables:
          DB_HOST:
            Fn::ImportValue:
              !Sub '${InfrastructureStackName}-DatabaseEndpoint'
          DB_PORT:
            Fn::ImportValue:
              !Sub '${InfrastructureStackName}-DatabasePort'
          DB_NAME:
            Fn::ImportValue:
              !Sub '${InfrastructureStackName}-DatabaseName'
          DB_SECRET_ARN:
            Fn::ImportValue:
              !Sub '${InfrastructureStackName}-DatabaseSecretArn'
          DEPLOYMENT_VERSION:
            !Ref DeploymentVersion
      Tags:
        - Key: Project
          Value: FairWorkPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Component
          Value: DatabaseMigration
  MigrationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        !Sub '/aws/lambda/${ProjectName}-${EnvironmentName}-database-migration'
      RetentionInDays:
        !Ref LogRetentionDays
  FairWorkUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName:
        !Sub '${ProjectName}-${EnvironmentName}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserPoolTags:
        Project: FairWorkPulse
        Environment: !Ref EnvironmentName
  FairWorkUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName:
        !Sub '${ProjectName}-${EnvironmentName}-web-client'
      UserPoolId:
        !Ref FairWorkUserPool
      GenerateSecret: false
      PreventUserExistenceErrors:
        ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
  EmployeeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: EMPLOYEE
      Description: FairWork Pulse employee accounts.
      Precedence: 30
      UserPoolId:
        !Ref FairWorkUserPool
  EmployerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: EMPLOYER
      Description: FairWork Pulse employer accounts.
      Precedence: 20
      UserPoolId:
        !Ref FairWorkUserPool
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: ADMIN
      Description: FairWork Pulse administrator accounts.
      Precedence: 10
      UserPoolId:
        !Ref FairWorkUserPool
  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        !Sub '${ProjectName}-${EnvironmentName}-api'
      Description: FairWork Pulse application API.
      Runtime:
        !Ref LambdaRuntime
      Handler:
        index.handler
      Role:
        Fn::ImportValue:
          !Sub '${InfrastructureStackName}-LabRoleArn'
      MemorySize: 256
      Timeout: 30
      Code:
        S3Bucket:
          Fn::ImportValue:
            !Sub '${InfrastructureStackName}-LambdaArtifactBucketName'
        S3Key:
          !Ref ApiLambdaS3Key
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub '${InfrastructureStackName}-LambdaSecurityGroupId'
        SubnetIds:
          - Fn::ImportValue:
              !Sub '${InfrastructureStackName}-PrivateAppSubnetAId'
          - Fn::ImportValue:
              !Sub '${InfrastructureStackName}-PrivateAppSubnetBId'
      Environment:
        Variables:
          DB_HOST:
            Fn::ImportValue:
              !Sub '${InfrastructureStackName}-DatabaseEndpoint'
          DB_PORT:
            Fn::ImportValue:
              !Sub '${InfrastructureStackName}-DatabasePort'
          DB_NAME:
            Fn::ImportValue:
              !Sub '${InfrastructureStackName}-DatabaseName'
          DB_SECRET_ARN:
            Fn::ImportValue:
              !Sub '${InfrastructureStackName}-DatabaseSecretArn'
          MODERATION_QUEUE_URL: !Ref ModerationQueue
          ALLOWED_ORIGIN:
            !Ref AllowedOrigin
          DEPLOYMENT_VERSION:
            !Ref DeploymentVersion
      Tags:
        - Key: Project
          Value: FairWorkPulse
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Component
          Value: API
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        !Sub '/aws/lambda/${ProjectName}-${EnvironmentName}-api'
      RetentionInDays:
        !Ref LogRetentionDays
  FairWorkApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name:
        !Sub '${ProjectName}-${EnvironmentName}-api'
      Description: REST API for FairWork Pulse.
      EndpointConfiguration:
        Types:
          - REGIONAL
  FairWorkCognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: FairWorkCognitoAuthorizer
      Type: COGNITO_USER_POOLS
      RestApiId:
        !Ref FairWorkApi
      IdentitySource:
        method.request.header.Authorization
      ProviderARNs:
        - !GetAtt FairWorkUserPool.Arn
  HealthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        !Ref FairWorkApi
      ParentId:
        !GetAtt FairWorkApi.RootResourceId
      PathPart: health
  HealthGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        !Ref FairWorkApi
      ResourceId:
        !Ref HealthResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          !Sub
            - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
            - LambdaArn: !GetAtt ApiFunction.Arn
  HealthOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        !Ref FairWorkApi
      ResourceId:
        !Ref HealthResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: |
            {
              "statusCode": 200
            }
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers:
                "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods:
                "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin:
                !Sub "'${AllowedOrigin}'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
  ProfileResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        !Ref FairWorkApi
      ParentId:
        !GetAtt FairWorkApi.RootResourceId
      PathPart: profile
  ProfileGetMethod:
