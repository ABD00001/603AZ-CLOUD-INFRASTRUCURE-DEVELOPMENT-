    Properties:
      RestApiId: !Ref FairWorkApi
      ResourceId: !Ref CompanyReviewsResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref FairWorkCognitoAuthorizer
