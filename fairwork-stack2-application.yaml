    Value:
      !Ref FairWorkApi
  ApiBaseUrl:
    Description: FairWork Pulse API base URL.
    Value:
      !Sub 'https://${FairWorkApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}'
  HealthUrl:
    Description: Public API health endpoint.
    Value:
      !Sub 'https://${FairWorkApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}/health'
  ProfileUrl:
    Description: Cognito protected profile endpoint.
    Value:
      !Sub 'https://${FairWorkApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}/profile'
  CompaniesUrl:
    Description: Cognito protected companies endpoint.
    Value:
      !Sub 'https://${FairWorkApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}/companies'
  WorkplaceAssociationsUrl:
    Description: Cognito protected workplace associations endpoint.
    Value:
      !Sub 'https://${FairWorkApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}/workplace-associations'
  WorkplaceAssociationVerifyUrl:
    Description: Employee workplace verification-code redemption endpoint.
    Value:
      !Sub 'https://${FairWorkApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}/workplace-associations/verify'
