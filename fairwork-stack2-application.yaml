      RestApiId: !Ref FairWorkApi
      ParentId: !Ref AdminReviewsResource
      PathPart: '{reviewId}'
  AdminApproveResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref FairWorkApi
      ParentId: !Ref AdminReviewIdResource
      PathPart: 'approve'
  AdminRejectResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref FairWorkApi
